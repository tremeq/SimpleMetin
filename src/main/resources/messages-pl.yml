# ============================================
# SimpleMetin - wiadomosci po polsku
# ============================================
# Wybor pliku w config.yml:  language: pl
#
# Formatowanie: kody & (&e, &l, &#ff8800) oraz MiniMessage (<gradient:gold:yellow>, <#ff8800>,
# <hover:show_text:'...'>, <click:run_command:'/...'>) dzialaja razem, nawet w jednej linii.
# Ustaw wiadomosc na "" aby ja wylaczyc. Brakujace klucze sa dopisywane automatycznie przy starcie.
# Placeholdery maja postac %nazwa% i sa wypisane obok kazdej wiadomosci.

prefix: "&8[&eSimpleMetin&8]&r "

# ── Ogolne ──────────────────────────────────────────────────
no-permission: "&cNie masz uprawnien do tej komendy."
player-only: "&cTej komendy moze uzyc tylko gracz."
player-not-found: "&cNie znaleziono gracza &e%player%&c."         # %player%
player-never-joined: "&cGracz &e%player% &cnie zostal znaleziony (nie gral jeszcze na serwerze)."  # %player%
invalid-number: "&cNieprawidlowa liczba: &e%value%"               # %value%
usage: "&cUzycie: &e%usage%"                                      # %usage%
reloaded: "&aKonfiguracja przeladowana."
reload-pending-loaded: "&aZaladowano &e%count% &awczesniej niedostepnych krysztalow."  # %count%

# ── Krysztaly ───────────────────────────────────────────────
spawned: "&aPostawiono krysztal &e%id%&a w Twojej lokalizacji."   # %id% %type%
