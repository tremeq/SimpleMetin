no-crystal-nearby: "&cBrak krysztalu w promieniu &e%range% &cblokow."  # %range%
respawned: "&aRecznie odrodzono krysztal &e%id%"                   # %id%
not-destroyed: "&cKrysztal &e%id% &cnie jest zniszczony."           # %id%
teleported: "&aPrzeteleportowano do krysztalu &e%id%&a."            # %id%

list-empty: "&7Brak krysztalow."
