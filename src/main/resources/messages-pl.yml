boost-player-activated: "&aAktywowano boost &e%multiplier%x &adla &e%player%"  # %multiplier% %player% %duration%
boost-player-replaced: "&aAktywowano boost &e%multiplier%x &adla &e%player% &7(zastapil poprzedni boost)"
boost-invalid-type: "&cNieprawidlowy typ! Uzyj 'global' lub 'player'"
bossbar-boost-personal: "&e&l⚡ BOOST OSOBISTY &e%multiplier%x &7- &e%time%"  # %multiplier% %time%
bossbar-boost-global: "&6&l⭐ BOOST GLOBALNY &6%multiplier%x &7- &6%time%"     # %multiplier% %time%

