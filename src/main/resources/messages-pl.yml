# ── Statystyki (/metin stats) ───────────────────────────────
# %player% %destroyed% %damage% %items% %money% %strength% %rank_destroyed% %rank_damage% %rank_items% %rank_money%
stats:
  - "&e&lStatystyki gracza %player%:"
  - "&7Zniszczone krysztaly: &e%destroyed% &8(#%rank_destroyed%)"
  - "&7Zadane obrazenia: &e%damage% &8(#%rank_damage%)"
  - "&7Otrzymane przedmioty: &e%items% &8(#%rank_items%)"
  - "&7Zarobione pieniadze: &e$%money% &8(#%rank_money%)"
  - "&7Sila: &e%strength%"
stats-types-header: "&7Zniszczone wg typu:"
stats-type-line: "&7  - &f%type%&7: &e%count%"                     # %type% %count%
stats-none: "&7%player% nie zaatakowal jeszcze zadnego krysztalu."  # %player%

# ── Boosty ──────────────────────────────────────────────────
boost-activated: "&a&lBOOST AKTYWNY! &e%multiplier%x &aszansy na drop przez &e%duration%"  # %multiplier% %duration%
boost-expired: "&c&lBOOST WYGASL! &7Twoj boost dropu sie skonczyl."
global-boost-activated: "&6&l[SERWER] &e%multiplier%x &6Globalny boost dropu aktywny przez &e%duration%&6!"  # %multiplier% %duration%
global-boost-expired: "&c&l[SERWER] &7Globalny boost dropu wygasl."
