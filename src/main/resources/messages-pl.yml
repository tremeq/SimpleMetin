# %id% %status% %type% %hp% %max_hp% %world% %x% %y% %z% %spawner%
list-entry: "&7- &e%id% %status% &7Typ: &f%type% &7HP: &c%hp%&7/&c%max_hp% &8(%world% %x% %y% %z%)"
