# ============================================
# SimpleMetin Configuration
# ============================================
# Missing options are added to this file automatically on startup (your values and comments are kept).
# Texts live in messages-en.yml / messages-pl.yml, automatic spawns in spawners.yml,
# items saved with /metin item save in items.yml.
#
# PLACEHOLDERS (requires PlaceholderAPI):
#   %metin_crystals_destroyed%  %metin_total_damage%  %metin_items_received%  %metin_money_earned%
#   %metin_type_<crystal_id>%   e.g. %metin_type_metin_common%
#   %metin_boost_multiplier%  %metin_boost_active%  %metin_personal_boost_multiplier%  %metin_personal_boost_time%
#   %metin_global_boost_multiplier%  %metin_global_boost_time%
#   %metin_<destroyed|damage|items|money>_top_<1-100>%  and  ..._top_<N>_name%
#   %simplemetin_damage%  %simplemetin_top_name_<N>%  %simplemetin_top_value_<N>%
#
# Full documentation: README.md
# ============================================

# Message file: en = messages-en.yml, pl = messages-pl.yml (any messages-<code>.yml you create works too)
language: en

settings:
  save-interval: 300  # Auto-save interval in seconds (data.yml, stats.yml, boosts.yml)
  hologram-update-interval: 20  # Hologram update interval in ticks
  actionbar-enabled: true  # Show actionbar messages (crystal HP, hit cooldown); false disables them globally
  bossbar-enabled: true  # Show boss bars
  bossbar-range: 30.0  # Boss bar visibility range
  hit-cooldown: 1.0  # Cooldown between hits in seconds (0.0 to disable)
  leaderboard-update-interval: 6000  # Leaderboard file update interval in ticks (6000 = 5 minutes)
  top-cache-seconds: 5  # How long %metin_*_top_N% placeholders reuse the sorted ranking (0 = always fresh)
  projectile-hits: false  # true = arrows/tridents/snowballs shot by a player count as a hit (same cooldown and strength)
  nearest-range: 10.0  # Range in blocks for "nearest" in /metin remove|respawn|info

# Automatic spawns - spawners are defined in spawners.yml
auto-spawn:
  enabled: true
  max-alive-total: 10  # Limit of crystals from all spawners together (0 = no limit)
  min-players-online: 1  # No automatic spawns while fewer players are online

boosts:
  bossbar:
    enabled: true
    update-interval: 20  # Update interval in ticks (20 = 1 second); titles are in the messages file
    personal:
      enabled: true
      color: YELLOW  # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      style: SOLID  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    global:
      enabled: true
      color: GREEN
      style: SEGMENTED_10
  global:
    enabled: true
    # How global and personal boosts combine when stacking-enabled is true:
    #   1.0 = additive        (2x global + 2x personal = 3x)
    #   2.0 = multiplicative  (2x global * 2x personal = 4x)
    stacking-mode: 1.0
  personal:
    enabled: true
    stacking-enabled: true  # false = only the higher of global/personal applies
    voucher:  # name and lore are in the messages file (voucher-name, voucher-lore)
      material: PAPER
      glow: true
      custom-model-data: 0  # Set to 0 to disable

# ============================================
# Crystal types
# ============================================
# Damage per hit (per crystal type):
#   use-damage-per-hit: true   every hit deals "damage-per-hit" HP (player strength is ignored)
#   use-damage-per-hit: false  every hit deals the player's strength (/ma, default 10)
#   not set: true if the type has "damage-per-hit", otherwise player strength
#
# Drops - every entry in hit-drops / death-drops is rolled on its own:
#   item: DIAMOND            material, or
#   custom-item: my_sword    an item saved with /metin item save my_sword (items.yml)
#   amount: 2  or  "1-3"     fixed or random amount
#   chance: 50.0             percent, multiplied by active boosts (max 100)
#   name / lore              optional, & codes and MiniMessage
#   enchantments: {sharpness: 3, unbreaking: 2}
#   custom-model-data: 1001
#   command: "eco give %player% 100"   an entry can run a command instead of giving an item
# hit-commands / death-commands work as before (command + chance).
#
# Pools (hit-pools / death-pools) pick entries by weight - "one of these":
#   rolls: 1 or "1-2"        how many entries are picked
#   chance: 100              chance that the pool rolls at all (boosted)
#   unique: true             the same entry is not picked twice in one roll
#   entries: { key: { item/custom-item/command ..., weight: 10 } }
crystals:
  metin_common:
    display-name: "&e&lCommon Metin"
    type: respawn
    max-hp: 50
    use-damage-per-hit: true  # true = every hit deals damage-per-hit, false = damage = player strength (/ma, default 10)
    damage-per-hit: 1
    respawn-time: 300
    show-actionbar: true
    show-bossbar: true
    hologram:
      enabled: true
      range: 32.0  # View range in blocks
      height: 2.3  # Height above the crystal
      background: "#00000000"  # ARGB hex; "#00000000" = transparent, "default" = vanilla dark box
      shadow: true
      see-through: false  # Visible through blocks
      lines:
        - "&e&lCOMMON METIN"
        - "&7HP: &c%hp%&7/&c%max_hp%"
        - "&aAttack to mine!"
    hit-drops:
      drop1:
        item: DIAMOND
        amount: 1
        chance: 5.0
        name: "&bMetin Diamond"
        lore:
          - "&7Obtained from Metin"
      drop2:
        item: GOLD_INGOT
        amount: "1-3"
        chance: 15.0
    hit-commands:
      cmd1:
        command: "eco give %player% 10"
        chance: 20.0
    death-drops:
      drop1:
        item: DIAMOND
        amount: 5
        chance: 100.0
        name: "&bMetin Reward"
      drop2:
        item: EMERALD
        amount: "2-4"
        chance: 50.0
    death-pools:
      bonus:
        rolls: 1
        chance: 100.0
        entries:
          sword:
            item: DIAMOND_SWORD
            weight: 25
            name: "<gradient:aqua:blue>Metin Blade</gradient>"
            enchantments:
              sharpness: 3
          apples:
            item: GOLDEN_APPLE
            amount: "1-2"
            weight: 50
          money:
            command: "eco give %player% 250"
            weight: 25
    death-commands:
      cmd1:
        command: "eco give %player% 500"
        chance: 100.0
    death-effects:
      particle: EXPLOSION_EMITTER
      sound: ENTITY_GENERIC_EXPLODE
      volume: 1.0
      pitch: 1.0

  metin_rare:
    display-name: "&d&lRare Metin"
    type: one-time
    max-hp: 150
    use-damage-per-hit: false  # damage = player strength (/ma), 150 HP = 15 hits at the default strength 10
    damage-per-hit: 1  # used only when use-damage-per-hit is true
    respawn-time: 0
    show-actionbar: true
    show-bossbar: true
    hologram:
      enabled: true
      range: 48.0
      height: 2.3
      background: "#00000000"
      shadow: true
      see-through: false
      lines:
        - "<gradient:light_purple:dark_purple><bold>RARE METIN</bold></gradient>"
        - "&7HP: &c%hp%&7/&c%max_hp%"
        - "&6Destroy for epic loot!"
    hit-drops:
      drop1:
        item: DIAMOND
        amount: "1-2"
        chance: 10.0
      drop2:
        item: EMERALD
        amount: 1
        chance: 8.0
    hit-commands:
      cmd1:
        command: "eco give %player% 25"
        chance: 15.0
    death-drops:
      drop1:
        item: DIAMOND_BLOCK
        amount: 3
        chance: 100.0
        name: "&d&lRare Metin Reward"
        lore:
          - "&7A valuable reward"
          - "&7from the Rare Metin"
      drop2:
        item: NETHERITE_INGOT
        amount: 1
        chance: 30.0
    death-commands:
      cmd1:
        command: "eco give %player% 2000"
        chance: 100.0
    death-effects:
      particle: DRAGON_BREATH
      sound: ENTITY_ENDER_DRAGON_DEATH
      volume: 1.5
      pitch: 1.2
